services:
  postgres:
    image: postgres:15-alpine
    container_name: biblios_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: biblios_password
      POSTGRES_DB: biblios_db
    ports:
      - "5432:5432"
    volumes:
      # Este volumen es CRÍTICO para que no se borren los datos al apagar el contenedor
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    container_name: biblios_api
    ports:
      - "3000:3000"
    environment:
      # IMPORTANTE: El host ahora es el nombre del servicio de BD ('postgres'), no 'localhost'
      DATABASE_URL: postgres://postgres:biblios_password@postgres:5432/biblios_db
      PORT: 3000
      JWT_SECRET: tu_secreto_jwt_super_seguro
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: